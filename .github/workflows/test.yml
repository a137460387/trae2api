name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check every source file
        run: node --check src/server.js
        shell: bash

  hygiene:
    # Fails if credentials or runtime state ever get committed. The repo is meant to
    # ship without any account material, so this is a hard gate rather than a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials / runtime state
        run: |
          set -e
          fail=0
          # Pool member files carry plaintext tokens.
          if git ls-files | grep -qE '^accounts/account-.*\.json$'; then
            echo "::error::account pool member committed (contains plaintext tokens)"
            fail=1
          fi
          # Local env files and runtime artifacts must never be tracked.
          if git ls-files | grep -qE '^\.env$|^logs/|^captures/|^output/'; then
            echo "::error::local env or runtime artifact committed"
            fail=1
          fi
          # JWTs in source would be live credentials.
          if git grep -nE 'eyJhbGciOi[A-Za-z0-9_-]{10,}' -- ':!package-lock.json' ':!tests/*'; then
            echo "::error::a JWT-like string is committed"
            fail=1
          fi
          exit $fail
